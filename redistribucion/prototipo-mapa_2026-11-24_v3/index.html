<!doctype html>
<html lang="es" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa NAU-2 · v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Tema: todos los colores salen de aquí (el canvas los lee también) ---------- */
  :root, [data-theme="claro"] {
    --fondo: #f4f5f7; --superficie: #ffffff; --superficie-2: #f8f9fb; --linea: #e4e7ec; --linea-fuerte: #cfd5dd;
    --texto: #18202b; --texto-2: #586374; --texto-3: #8b95a3; --acento: #2f5fd0; --acento-suave: #e8eefc;
    --sombra: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.08);
    --plano: #eef0f3; --suelo: #fbfbfc; --pasillo: #e9ecf0; --pasillo-texto: #9aa3af; --borde-nave: #b9c0ca;
    --z0: #2f6fdb; --zZ: #e2832b; --zM: #8b5cf6; --zV: #d9dde3;
    --p0v: #a9c2f0; --pZv: #f3cfa6; --libre: #6cc3ae; --muelle: #c79a1e; --muellev: #f1e3b0;
    --ejemplo: #b45309; --ejemplo-fondo: #fff4e6; --oro: #d4a72c;
    --apagado: #dfe3e8; --texto-celda-oscura: #ffffff;
  }
  [data-theme="oscuro"] {
    --fondo: #0f1318; --superficie: #171c23; --superficie-2: #1c222a; --linea: #262d37; --linea-fuerte: #343d49;
    --texto: #e8ecf1; --texto-2: #a4afbd; --texto-3: #6f7a88; --acento: #7aa2ff; --acento-suave: #1d2a45;
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    --plano: #0c1015; --suelo: #141920; --pasillo: #1a2029; --pasillo-texto: #5e6a79; --borde-nave: #3a4452;
    --z0: #5b8ff0; --zZ: #f0973f; --zM: #a78bfa; --zV: #2f3742;
    --p0v: #2c4a80; --pZv: #6b4824; --libre: #3fa48d; --muelle: #d6ab2f; --muellev: #4f4422;
    --ejemplo: #f59e0b; --ejemplo-fondo: #2a1f0e; --oro: #e9c25a;
    --apagado: #222831; --texto-celda-oscura: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 13px/1.4 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: 52px 1fr 26px; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  .oculto { display: none !important; }

  /* ---------- Barra ---------- */
  #barra { display: flex; align-items: center; gap: 5px; padding: 0 10px; background: var(--superficie);
    border-bottom: 1px solid var(--linea); min-width: 0; }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .marca i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--z0), var(--zZ)); display: inline-block; }
  #migas { display: flex; align-items: center; gap: 2px; white-space: nowrap; color: var(--texto-2); }
  #migas button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--texto-2); }
  #migas button:hover { background: var(--superficie-2); color: var(--texto); }
  #migas button[aria-current="page"] { color: var(--texto); font-weight: 600; cursor: default; background: none; }
  #migas .sep { color: var(--texto-3); }
  .segmentado { display: inline-flex; background: var(--superficie-2); border: 1px solid var(--linea); border-radius: 8px; padding: 2px; }
  .segmentado button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer;
    color: var(--texto-2); white-space: nowrap; }
  .segmentado button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra); font-weight: 600; }
  .control { height: 30px; border: 1px solid var(--linea); border-radius: 8px; background: var(--superficie); padding: 0 10px; }
  select.control { padding-right: 4px; max-width: 175px; cursor: pointer; }
  .boton { height: 30px; border: 1px solid var(--linea); border-radius: 8px; background: var(--superficie);
    padding: 0 9px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .boton:hover { border-color: var(--linea-fuerte); }
  .boton[aria-pressed="true"] { background: var(--acento-suave); border-color: transparent; color: var(--acento); font-weight: 600; }
  .icono { width: 30px; padding: 0; justify-content: center; }
  #buscar { width: 120px; }
  .hueco-flex { flex: 1; }
  .ej { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--ejemplo); background: var(--ejemplo-fondo);
    border: 1px dashed var(--ejemplo); border-radius: 4px; padding: 0 5px; line-height: 16px; white-space: nowrap; }

  /* ---------- Cuerpo ---------- */
  #cuerpo { display: grid; grid-template-columns: 1fr 330px; min-height: 0; transition: grid-template-columns .25s ease; }
  #cuerpo.sin-panel { grid-template-columns: 1fr 0px; }
  #lienzo { position: relative; min-width: 0; background: var(--plano); overflow: hidden; }
  #vistas { position: absolute; inset: 0; display: flex; }
  #vistas.vertical { flex-direction: column; }
  .vista { position: relative; flex: 1; min-width: 0; min-height: 0; }
  .vista + .vista { border-left: 1px solid var(--linea); }
  #vistas.vertical .vista + .vista { border-left: 0; border-top: 1px solid var(--linea); }
  .vista canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .vista canvas.arrastrando { cursor: grabbing; }
  .vista canvas.sobre-celda { cursor: pointer; }
  .vista canvas.seleccionando { cursor: crosshair; }
  .rotulo-vista { position: absolute; left: 14px; top: 10px; font-weight: 600; font-size: 12px; color: var(--texto-2);
    background: color-mix(in srgb, var(--superficie) 85%, transparent); padding: 3px 8px; border-radius: 6px; pointer-events: none; }

  /* Cortina */
  #cortina { position: absolute; top: 0; bottom: 0; width: 0; z-index: 5; }
  #cortina::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--texto); opacity: .8; }
  #cortina .asa { position: absolute; top: 50%; left: -16px; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%;
    background: var(--superficie); box-shadow: var(--sombra); border: 1px solid var(--linea-fuerte); cursor: ew-resize;
    display: grid; place-items: center; font-size: 13px; color: var(--texto-2); user-select: none; }
  #cortina .et { position: absolute; top: 12px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px;
    background: var(--superficie); box-shadow: var(--sombra); white-space: nowrap; }
  #cortina .et.izq { right: 10px; } #cortina .et.der { left: 10px; }

  /* Leyenda flotante */
  #leyenda { position: absolute; left: 14px; bottom: 14px; z-index: 4; background: color-mix(in srgb, var(--superficie) 94%, transparent);
    backdrop-filter: blur(6px); border-radius: 10px; box-shadow: var(--sombra); padding: 10px 12px; max-width: min(760px, calc(100% - 28px)); }
  #leyenda h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .chip-detalle { font-size: 10.5px; font-weight: 500; color: var(--texto-2); background: var(--superficie-2);
    border: 1px solid var(--linea); border-radius: 10px; padding: 0 7px; }
  .leyenda-vista { position: absolute; left: 14px; right: 14px; bottom: 8px; z-index: 3; }
  .leyenda-vista .chips { flex-wrap: nowrap; overflow: hidden; }
  .leyenda-vista .chip { padding: 1px 8px 1px 5px; font-size: 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea); background: var(--superficie);
    border-radius: 14px; padding: 2px 9px 2px 6px; cursor: pointer; font-size: 11.5px; white-space: nowrap; }
  .chip i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .chip b { font-weight: 600; color: var(--texto-2); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="false"] { opacity: .4; }
  .chip[aria-pressed="false"] i { background: var(--apagado) !important; }
  .chip:hover { border-color: var(--linea-fuerte); }
  #histo text { fill: var(--texto-2); font-size: 10.5px; font-family: Inter, system-ui, sans-serif; }
  #histo .selection { fill: var(--acento); fill-opacity: .08; stroke: var(--acento); stroke-opacity: .6; }
  #histo .handle { fill: var(--acento); rx: 2; }
  .ayuda-leyenda { font-size: 11px; color: var(--texto-3); margin-top: 4px; }

  /* Tooltip */
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--superficie); color: var(--texto);
    border-radius: 8px; box-shadow: var(--sombra); padding: 8px 10px; min-width: 170px; max-width: 260px; opacity: 0;
    transform: translateY(4px); transition: opacity .12s, transform .12s; border: 1px solid var(--linea); }
  #tip.visible { opacity: 1; transform: none; }
  #tip .t { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #tip .t i { width: 10px; height: 10px; border-radius: 3px; }
  #tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; }
  #tip dt { color: var(--texto-2); } #tip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

  /* Alzado */
  #alzado { position: absolute; inset: 0; background: var(--plano); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
  #alzado.visible { opacity: 1; pointer-events: auto; }
  #alzado svg { width: 100%; height: 100%; display: block; }
  #alzado .celda rect { transition: fill .35s, opacity .2s; cursor: pointer; }
  #alzado .celda:hover rect.fondo { stroke: var(--texto); stroke-width: 1.5; }
  #alzado text { font-family: Inter, system-ui, sans-serif; }

  /* Carga */
  #carga { position: absolute; inset: 0; display: grid; place-items: center; color: var(--texto-2); z-index: 20; background: var(--plano); }
  #carga .rueda { width: 28px; height: 28px; border: 3px solid var(--linea); border-top-color: var(--acento); border-radius: 50%;
    animation: gira 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ---------- Panel ---------- */
  #panel { background: var(--superficie); border-left: 1px solid var(--linea); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  #panel-dentro { overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 330px; }
  .tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 12px; background: var(--superficie); }
  .tarjeta h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--texto-3); font-weight: 600;
    display: flex; align-items: center; gap: 8px; }
  .tarjeta h4 .der { margin-left: auto; }
  .tarjeta.ejemplo { border: 1.5px dashed var(--ejemplo); background: var(--ejemplo-fondo); }
  .fijada h5 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .fijada h5 i { width: 12px; height: 12px; border-radius: 3px; }
  .fijada .letra { font-size: 10px; font-weight: 700; color: var(--superficie); background: var(--texto); border-radius: 4px; padding: 0 5px; }
  .cerrar { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--texto-3); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .cerrar:hover { background: var(--superficie-2); color: var(--texto); }
  .datos { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-top: 8px; font-size: 12.5px; }
  .datos span:nth-child(odd) { color: var(--texto-2); }
  .datos span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  .datos .sub { grid-column: 1 / -1; font-size: 11px; color: var(--texto-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .acciones { display: flex; gap: 6px; margin-top: 10px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--superficie-2); border-radius: 8px; padding: 8px 10px; }
  .kpi .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .e { font-size: 11px; color: var(--texto-2); }
  .kpi .d { font-size: 11px; font-weight: 600; }
  .kpi .d.mejor { color: #16865f; } .kpi .d.peor { color: #c2410c; }
  [data-theme="oscuro"] .kpi .d.mejor { color: #4ade80; } [data-theme="oscuro"] .kpi .d.peor { color: #fb923c; }
  .lista { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; position: relative; }
  .lista li { display: grid; grid-template-columns: 44px 1fr 62px; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .lista li:hover, .lista li.activo { background: var(--acento-suave); }
  .lista .barra { height: 8px; border-radius: 4px; background: var(--superficie-2); overflow: hidden; }
  .lista .barra i { display: block; height: 100%; border-radius: 4px; }
  .lista .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--texto-2); }
  .mov li { grid-template-columns: 20px 1fr 54px; }
  table.cont { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  table.cont th, table.cont td { padding: 4px 4px; text-align: left; border-bottom: 1px solid var(--linea); }
  table.cont td.n, table.cont th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .nota { font-size: 11.5px; color: var(--texto-2); }
  code { font-size: 11px; background: var(--superficie-2); padding: 0 4px; border-radius: 4px; }

  /* Listas (encima del plano) */
  #listas { position: absolute; inset: 10px; z-index: 30; background: var(--superficie); border-radius: 12px; box-shadow: var(--sombra);
    border: 1px solid var(--linea); display: flex; flex-direction: column; padding: 12px 14px; min-height: 0; }
  .cab-lista { display: flex; align-items: center; gap: 8px; }
  .cab-lista .cerrar { font-size: 20px; }
  .pestanas { flex-wrap: wrap; }
  .cuerpo-lista { display: flex; flex-direction: column; min-height: 0; flex: 1; margin-top: 10px; }
  .filtros { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filtros #l-filtro { width: 300px; }
  .tabla-lista { overflow: auto; flex: 1; min-height: 0; border: 1px solid var(--linea); border-radius: 8px; }
  .tabla-lista table.cont { margin: 0; }
  .tabla-lista thead th { position: sticky; top: 0; background: var(--superficie-2); z-index: 1; }
  .tabla-lista tbody tr { cursor: pointer; }
  .tabla-lista tbody tr:hover { background: var(--acento-suave); }
  .tabla-lista td { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.cont a { color: var(--acento); text-decoration: none; }
  .mod li { grid-template-columns: 44px 1fr 62px; }

  /* ---------- Estado ---------- */
  #estado { display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 11.5px; color: var(--texto-3);
    background: var(--superficie); border-top: 1px solid var(--linea); white-space: nowrap; overflow: hidden; }
  #estado b { color: var(--texto-2); font-weight: 600; }
  kbd { font: 10.5px Inter, system-ui; border: 1px solid var(--linea-fuerte); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--texto-2); }
</style>
</head>
<body>
  <header id="barra">
    <div class="marca"><i role="presentation"></i>NAU-2</div>
    <nav id="migas" aria-label="Nivel"></nav>
    <span class="hueco-flex"></span>
    <div class="segmentado" id="modos" role="group" aria-label="Qué se ve">
      <button data-modo="hoy" aria-pressed="true">Hoy</button>
      <button data-modo="plan" aria-pressed="false" title="Estimación del Excel del 06/11, sin probar">Plan Z5+01 <span class="ej">06/11</span></button>
      <button data-modo="cortina" aria-pressed="false" title="Hoy a la izquierda, plan a la derecha: arrastra la línea">Cortina</button>
      <button data-modo="lado" aria-pressed="false" title="Hoy y plan a la vez, con el mismo zoom">Lado a lado</button>
      <button data-modo="dif" aria-pressed="false" title="Qué cambia en cada posición">Diferencia</button>
    </div>
    <select id="medida" class="control" aria-label="Medida"></select>
    <button id="b-contorno" class="boton" aria-pressed="false" title="Línea entre posiciones vecinas de zona 0 y zona Z">Límite</button>
    <button id="b-oro" class="boton" aria-pressed="false" title="Posiciones a menos de 40 m de expedición (geometría de kpi.py)">Zona de oro</button>
    <button id="b-flechas" class="boton" aria-pressed="false" title="Movimientos: DATOS DE EJEMPLO">Movimientos <span class="ej">EJ.</span></button>
    <button id="b-listas" class="boton" title="Listas: modelos repartidos, contenedores a cero, huecos mezclados, sin salidas, pendiente de ubicar">Listas</button>
    <input id="buscar" class="control" type="search" list="sugerencias" placeholder="Modelo, L45, I16…" aria-label="Buscar">
    <datalist id="sugerencias"></datalist>
    <button id="b-tema" class="boton icono" title="Tema claro / oscuro" aria-label="Tema claro u oscuro">◐</button>
    <button id="b-png" class="boton" title="Guardar lo que se ve como PNG">PNG</button>
    <button id="b-panel" class="boton icono" title="Mostrar u ocultar el panel" aria-label="Panel">▤</button>
  </header>

  <main id="cuerpo">
    <section id="lienzo">
      <div id="vistas"></div>
      <div id="cortina" class="oculto"><span class="et izq">Hoy · Odoo</span><span class="et der">Plan Z5+01 · est. 06/11</span><div class="asa" title="Arrastra">⇔</div></div>
      <div id="leyenda"></div>
      <div id="alzado"></div>
      <div id="carga"><div><div class="rueda"></div>Cargando datos de la nave…</div></div>
      <div id="listas" class="oculto" role="dialog" aria-label="Listas">
        <div class="cab-lista"><div class="pestanas segmentado"></div><span class="hueco-flex"></span>
          <button class="cerrar" title="Cerrar (Esc)" aria-label="Cerrar" onclick="cerrarListas()">×</button></div>
        <div class="cuerpo-lista"></div>
      </div>
    </section>
    <aside id="panel"><div id="panel-dentro"></div></aside>
  </main>

  <footer id="estado"></footer>
  <div id="tip" role="tooltip"></div>

  <!-- d3, versión fija, un solo fichero -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <!-- SheetJS, versión fija: solo para «Exportar a Excel» de las listas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="mapa.js"></script>
</body>
</html>
