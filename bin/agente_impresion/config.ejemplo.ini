; KOROSHI agente de impresión: copiar como config.ini en la misma carpeta y rellenar.
; La contraseña NO va aquí: va en el Administrador de credenciales de Windows (LEEME.md, paso 4).

[odoo]
url = https://nath.tuctuc.com
bd = NATH_PRODUCTION
; El login (correo) del usuario Almacén Nath, tal como sale en sus Preferencias de Odoo
usuario = PONER_AQUI_EL_LOGIN

[impresora]
; El código de la impresora en Odoo (Inventario > Configuración > Impresión > Impresoras)
codigo = EXP1
; El nombre exacto en Windows («python agente_impresion.py --impresoras» los lista). Vacío = la predeterminada
nombre_windows =
; Dónde está SumatraPDF.exe (versión portable)
sumatra = C:\KoroshiImpresion\SumatraPDF.exe

[agente]
; Cada cuántos segundos pregunta a Odoo
segundos = 3
carpeta_log = C:\KoroshiImpresion\log
